<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>File check</title>
<style>body{font-family:system-ui,sans-serif;background:#f7efe1;color:#2f2a1a;padding:24px;max-width:560px;margin:auto}h1{font-size:1.3rem}li{list-style:none;padding:10px 12px;margin:6px 0;border-radius:10px;background:#fffbf2;border:1px solid #e8dcc0;display:flex;justify-content:space-between}.ok{color:#15803d;font-weight:700}.no{color:#b91c1c;font-weight:700}#sum{margin:14px 0;font-weight:600}</style></head>
<body><h1>Website file check</h1><p>Har file ke samne ✓ ya ✗ dikhega. ✗ wali file GitHub me root me upload karo (naam same rakho).</p><div id="sum">Checking...</div><ul id="l"></ul>
<script>
const files=["index.html","styles.css","config.js","script.js","privacy.html","favicon.svg","robots.txt","sitemap.xml","me.jpg","demo-doccare.jpg","demo-stayhaven.jpg","demo-glowup.jpg","demo-eduprime.jpg","demo-luxestate.jpg","demo-bakebrew.jpg","demo-fitpulse.jpg"];
const ul=document.getElementById("l");let bad=0,done=0;
files.forEach(f=>{const li=document.createElement("li");li.innerHTML=`<span>${f}</span><span>...</span>`;ul.appendChild(li);
 fetch(f+"?c="+Date.now(),{cache:"no-store"}).then(r=>{const ok=r.ok&&!/text\/html/.test(r.headers.get("content-type")||"")||f.endsWith(".html");
  li.lastChild.className=ok?"ok":"no";li.lastChild.textContent=ok?"✓":"✗ missing";if(!ok)bad++}).catch(()=>{li.lastChild.className="no";li.lastChild.textContent="✗ missing";bad++}).finally(()=>{if(++done===files.length)document.getElementById("sum").textContent=bad?bad+" file(s) missing":"Sab files sahi hain ✓"})});
</script></body></html>
